# /etc/nginx/sites-available/lesson24  →  ln -s ../sites-available/lesson24 /etc/nginx/sites-enabled/
# HTTPS: sudo certbot --nginx -d api.lesson24.uz  (certbot 443 blokini o'zi qo'shadi)

server {
    listen 80;
    server_name api.lesson24.uz;

    # Chek skrinshoti 5 MB + multipart; kurs muqovasi
    client_max_body_size 10M;

    location /static/ {
        alias /srv/lesson24/staticfiles/;
        expires 30d;
        access_log off;
    }

    # media/ da faqat to'lov cheklari — HECH QACHON ochiq berilmaydi (muqovalar ImgBB'da)
    location /media/ {
        return 404;
    }

    # Faqat Django X-Accel-Redirect orqali (admin ruxsati tekshirilgandan keyin)
    location /protected-media/ {
        internal;
        alias /srv/lesson24/media/;
        add_header Cache-Control "private, no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
